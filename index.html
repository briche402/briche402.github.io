<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Page</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #111;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 80px 24px 64px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: #666;
    font-size: 0.95rem;
    margin: 0 0 40px;
  }
  ul.cards {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: 12px;
  }
  ul.cards a {
    display: block;
    padding: 20px 22px;
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  ul.cards a:hover {
    border-color: #111;
    background: #fafafa;
  }
  .card-title {
    font-weight: 600;
    font-size: 1.02rem;
  }
</style>
</head>
<body>
<main>
  <h1>Project Page</h1>
  <p class="sub">Anonymous project listing.</p>
  <ul class="cards">
    <li><a href="./1/"><span class="card-title">Project 1</span></a></li>
    <li><a href="./2/"><span class="card-title">Project 2</span></a></li>
  </ul>
</main>
</body>
</html>
